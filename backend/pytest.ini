[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    native: marks tests using heavy native libraries (cv2, numpy, rasterio)

[tool:pytest]
# On Windows, native library crashes (cv2, numpy) can occur when running
# all tests in a single process due to accumulated native resources.
# Use `python run_tests_isolated.py` for full suite with process isolation.
# Individual test files can be run directly: pytest tests/<file>.py
